name: Release

# Builds Sortle for Android, macOS, Windows and Linux and attaches the files
# to a GitHub Release. Start it from the Actions tab (Release, Run workflow,
# type the version), or push a tag like v0.2.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, for example 0.2.0
        required: true
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # v0.2.0 from a tag, or 0.2.0 typed in.
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.v.outputs.number }}
    steps:
      - id: v
        run: |
          v="${VERSION#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$VERSION'"
            exit 1
          fi
          echo "number=$v" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$(cat .flutter-version)" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics && flutter pub get
      # Every release must be signed with the same key, or updates will not
      # install over the old version. See docs/signing.md.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Add the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD secrets first (docs/signing.md)"
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$PASSWORD"
            echo "keyAlias=upload"
            echo "keyPassword=$PASSWORD"
          } > android/key.properties
      - run: >-
          flutter build apk --release
          --build-name=${{ needs.version.outputs.number }}
          --build-number=${{ github.run_number }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk "Sortle-${{ needs.version.outputs.number }}-android.apk"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: Sortle-*-android.apk

  macos:
    name: macOS app
    needs: version
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$(cat .flutter-version)" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics && flutter pub get
      - run: >-
          flutter build macos --release
          --build-name=${{ needs.version.outputs.number }}
          --build-number=${{ github.run_number }}
      # A disk image with the app next to an Applications shortcut, so
      # installing is a drag.
      - name: Disk image
        run: |
          mkdir dmg
          cp -R build/macos/Build/Products/Release/Sortle.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Sortle -srcfolder dmg -ov -format UDZO "Sortle-${{ needs.version.outputs.number }}-macos.dmg"
      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: Sortle-*-macos.dmg

  windows:
    name: Windows app
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$(cat .flutter-version)" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics && flutter pub get
      - run: >-
          flutter build windows --release
          --build-name=${{ needs.version.outputs.number }}
          --build-number=${{ github.run_number }}
      - name: Zip
        shell: pwsh
        run: |
          $name = "Sortle-${{ needs.version.outputs.number }}-windows"
          Copy-Item -Recurse build\windows\x64\runner\Release $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: Sortle-*-windows.zip

  linux:
    name: Linux app
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$(cat .flutter-version)" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics && flutter pub get
      - run: >-
          flutter build linux --release
          --build-name=${{ needs.version.outputs.number }}
          --build-number=${{ github.run_number }}
      - run: |
          name="Sortle-${{ needs.version.outputs.number }}-linux"
          cp -r build/linux/x64/release/bundle "$name"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: Sortle-*-linux.tar.gz

  publish:
    name: Publish release
    needs: [version, android, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${{ needs.version.outputs.number }}"
          gh release create "$tag" dist/* \
            --target "${{ github.sha }}" \
            --title "Sortle ${{ needs.version.outputs.number }}" \
            --generate-notes
