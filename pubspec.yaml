name: sortle
description: "Offline mind-mapping and decision tracker."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: 3.47.9

dependencies:
  archive: ^4.6.0
  audioplayers: ^6.8.1
  dynamic_color: ^1.8.1
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.0
  flutter_riverpod: ^3.5.0
  flutter_timezone: ^5.1.1
  macos_window_utils: ^1.9.1
  path_provider: ^2.1.6
  record: ^7.1.2
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: FunnelDisplay
      fonts:
        - asset: assets/fonts/FunnelDisplay-Light.ttf
          weight: 300
        - asset: assets/fonts/FunnelDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/FunnelDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/FunnelDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/FunnelDisplay-Bold.ttf
          weight: 700
