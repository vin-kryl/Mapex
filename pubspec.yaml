name: mapex
description: "Offline mind-mapping and decision tracker."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: 3.47.9

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  path_provider: ^2.1.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: FunnelDisplay
      fonts:
        - asset: assets/fonts/FunnelDisplay-Light.ttf
          weight: 300
        - asset: assets/fonts/FunnelDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/FunnelDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/FunnelDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/FunnelDisplay-Bold.ttf
          weight: 700
